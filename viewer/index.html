<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            font-size: 13px;
            max-height: 90vh;
            overflow-y: auto;
        }
        #controls h3 {
            margin-bottom: 10px;
            color: #4a9eff;
        }
        #controls label {
            display: block;
            margin: 6px 0;
            cursor: pointer;
        }
        #controls input[type="checkbox"] {
            margin-right: 8px;
        }
        #controls button {
            margin: 5px 5px 5px 0;
            padding: 6px 12px;
            cursor: pointer;
            background: #4a9eff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 12px;
        }
        #controls button:hover {
            background: #3a8eef;
        }
        #controls .section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }
        #controls .section-title {
            font-weight: bold;
            color: #888;
            margin-bottom: 5px;
        }
        #controls select {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        #info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #pcb-canvas {
            background: #1a1a2e;
            cursor: grab;
        }
        #pcb-canvas:active {
            cursor: grabbing;
        }
        .color-legend {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }
        .color-box {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>PCB Viewer</h3>
        
        <div class="section">
            <div class="section-title">图层控制</div>
            <label>
                <input type="checkbox" id="showTracks" checked> 显示走线 (Tracks)
            </label>
            <label>
                <input type="checkbox" id="showPads" checked> 显示焊盘 (Pads)
            </label>
            <label>
                <input type="checkbox" id="showVias" checked> 显示过孔 (Vias)
            </label>
            <label>
                <input type="checkbox" id="showArcs" checked> 显示圆弧 (Arcs)
            </label>
            <label>
                <input type="checkbox" id="showComponents" checked> 显示位号 (Components)
            </label>
        </div>
        
        <div class="section">
            <div class="section-title">图层过滤</div>
            <select id="layerFilter">
                <option value="all">显示所有层</option>
            </select>
        </div>
        
        <div class="section">
            <div class="section-title">颜色图例</div>
            <div class="color-legend">
                <div class="color-box" style="background: #ffcc00;"></div>
                <span>Top Layer</span>
            </div>
            <div class="color-legend">
                <div class="color-box" style="background: #00ccff;"></div>
                <span>Bottom Layer</span>
            </div>
            <div class="color-legend">
                <div class="color-box" style="background: #ff6b6b;"></div>
                <span>内层 (Inner)</span>
            </div>
            <div class="color-legend">
                <div class="color-box" style="background: #888;"></div>
                <span>机械层/其他</span>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">视图控制</div>
            <div>
                <button id="zoomIn">放大 +</button>
                <button id="zoomOut">缩小 -</button>
            </div>
            <div>
                <button id="resetView">重置视图</button>
                <button id="refreshData">刷新数据</button>
            </div>
            <div style="margin-top: 8px;">
                <label>缩放: <span id="scaleValue">10</span> px/mm</label>
            </div>
        </div>
    </div>
    
    <div id="info">
        鼠标拖拽平移 | 滚轮缩放 | 坐标: <span id="coords">-</span>
    </div>
    
    <div id="canvas-container">
        <canvas id="pcb-canvas"></canvas>
    </div>

    <script>
        // 图层颜色映射
        const LAYER_COLORS = {
            'top layer': '#ffcc00',
            'bottom layer': '#00ccff',
            'top overlay': '#ff00ff',
            'bottom overlay': '#00ffff',
            'top solder': '#aa5500',
            'bottom solder': '#0055aa',
            'top paste': '#888800',
            'bottom paste': '#008888',
            'mechanical': '#666666',
            'keep out': '#ff0000',
            'multi-layer': '#cccccc',
            'drill guide': '#444444',
            'drill drawing': '#444444'
        };

        // 获取图层颜色
        function getLayerColor(layerName) {
            if (!layerName) return '#888888';
            const lower = layerName.toLowerCase();
            
            // 检查内层
            if (lower.includes('mid') || lower.includes('inner') || lower.includes('internal')) {
                return '#ff6b6b';
            }
            
            // 精确匹配
            for (const [key, color] of Object.entries(LAYER_COLORS)) {
                if (lower.includes(key)) {
                    return color;
                }
            }
            
            return '#888888';
        }

        // PCB渲染器类
        class PCBRenderer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                
                // 视图状态
                this.scale = 10;
                this.offsetX = 0;
                this.offsetY = 0;
                this.minScale = 0.5;
                this.maxScale = 200;
                
                // 数据
                this.pcbData = null;
                this.layers = new Set();
                this.currentLayer = 'all';
                
                // 显示选项
                this.showTracks = true;
                this.showPads = true;
                this.showVias = true;
                this.showArcs = true;
                this.showComponents = true;
                
                // 拖拽状态
                this.isDragging = false;
                this.lastMouseX = 0;
                this.lastMouseY = 0;
                
                // 边界
                this.bounds = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
                
                this.initCanvas();
                this.bindEvents();
            }
            
            initCanvas() {
                this.canvas.width = window.innerWidth - 20;
                this.canvas.height = window.innerHeight - 20;
            }
            
            bindEvents() {
                // 鼠标拖拽
                this.canvas.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                });
                
                window.addEventListener('mouseup', () => {
                    this.isDragging = false;
                });
                
                window.addEventListener('mousemove', (e) => {
                    if (this.isDragging) {
                        const dx = e.clientX - this.lastMouseX;
                        const dy = e.clientY - this.lastMouseY;
                        this.offsetX += dx;
                        this.offsetY += dy;
                        this.lastMouseX = e.clientX;
                        this.lastMouseY = e.clientY;
                        this.render();
                    }
                    
                    // 更新坐标显示
                    const rect = this.canvas.getBoundingClientRect();
                    const canvasX = e.clientX - rect.left;
                    const canvasY = e.clientY - rect.top;
                    const pcbX = (canvasX - this.offsetX) / this.scale;
                    const pcbY = -(canvasY - this.offsetY) / this.scale + (this.bounds.maxY || 0);
                    document.getElementById('coords').textContent = `${pcbX.toFixed(2)}mm, ${pcbY.toFixed(2)}mm`;
                });
                
                // 滚轮缩放
                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    
                    const oldScale = this.scale;
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    this.scale = Math.max(this.minScale, Math.min(this.maxScale, this.scale * delta));
                    
                    this.offsetX = mouseX - (mouseX - this.offsetX) * (this.scale / oldScale);
                    this.offsetY = mouseY - (mouseY - this.offsetY) * (this.scale / oldScale);
                    
                    document.getElementById('scaleValue').textContent = this.scale.toFixed(1);
                    this.render();
                });
                
                // 窗口大小变化
                window.addEventListener('resize', () => {
                    this.initCanvas();
                    this.render();
                });
            }
            
            async loadData(jsonPath) {
                try {
                    // 添加时间戳防止缓存
                    const url = `${jsonPath}?t=${Date.now()}`;
                    const response = await fetch(url, {
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    this.pcbData = await response.json();
                    this.collectLayers();
                    this.calculateBounds();
                    this.fitToView();
                    this.render();
                    console.log('数据加载成功:', this.pcbData);
                } catch (error) {
                    console.error('加载数据失败:', error);
                }
            }
            
            collectLayers() {
                const data = this.pcbData?.data;
                if (!data) return;
                
                // 从tracks收集图层
                if (data.tracks) {
                    data.tracks.forEach(t => {
                        if (t.layer) this.layers.add(t.layer);
                    });
                }
                
                // 从pads收集图层
                if (data.pads) {
                    data.pads.forEach(p => {
                        if (p.layer) this.layers.add(p.layer);
                    });
                }
                
                // 从arcs收集图层
                if (data.arcs) {
                    data.arcs.forEach(a => {
                        if (a.layer) this.layers.add(a.layer);
                    });
                }
                
                // 更新图层下拉框
                const select = document.getElementById('layerFilter');
                select.innerHTML = '<option value="all">显示所有层</option>';
                this.layers.forEach(layer => {
                    const option = document.createElement('option');
                    option.value = layer;
                    option.textContent = layer;
                    select.appendChild(option);
                });
            }
            
            calculateBounds() {
                const data = this.pcbData?.data;
                if (!data) return;
                
                const updateBounds = (x, y) => {
                    this.bounds.minX = Math.min(this.bounds.minX, x);
                    this.bounds.maxX = Math.max(this.bounds.maxX, x);
                    this.bounds.minY = Math.min(this.bounds.minY, y);
                    this.bounds.maxY = Math.max(this.bounds.maxY, y);
                };
                
                // tracks
                if (data.tracks) {
                    data.tracks.forEach(t => {
                        if (t.start) updateBounds(t.start.x_mm, t.start.y_mm);
                        if (t.end) updateBounds(t.end.x_mm, t.end.y_mm);
                    });
                }
                
                // pads
                if (data.pads) {
                    data.pads.forEach(p => {
                        if (p.position) updateBounds(p.position.x_mm, p.position.y_mm);
                    });
                }
                
                // vias
                if (data.vias) {
                    data.vias.forEach(v => {
                        if (v.position) updateBounds(v.position.x_mm, v.position.y_mm);
                    });
                }
                
                // arcs
                if (data.arcs) {
                    data.arcs.forEach(a => {
                        if (a.center) {
                            const r = a.radius_mm || 0;
                            updateBounds(a.center.x_mm - r, a.center.y_mm - r);
                            updateBounds(a.center.x_mm + r, a.center.y_mm + r);
                        }
                    });
                }
                
                // components
                if (data.components) {
                    data.components.forEach(c => {
                        if (c.position) updateBounds(c.position.x_mm, c.position.y_mm);
                    });
                }
                
                console.log('边界:', this.bounds);
            }
            
            fitToView() {
                if (!isFinite(this.bounds.maxX)) return;
                
                const padding = 80;
                const width = this.bounds.maxX - this.bounds.minX || 100;
                const height = this.bounds.maxY - this.bounds.minY || 100;
                
                const scaleX = (this.canvas.width - padding * 2) / width;
                const scaleY = (this.canvas.height - padding * 2) / height;
                this.scale = Math.min(scaleX, scaleY, 100);
                
                this.offsetX = padding - this.bounds.minX * this.scale;
                this.offsetY = padding - (this.bounds.maxY - this.bounds.minY) * this.scale;
                
                document.getElementById('scaleValue').textContent = this.scale.toFixed(1);
            }
            
            pcbToCanvas(x_mm, y_mm) {
                const canvasX = x_mm * this.scale + this.offsetX;
                const canvasY = -(y_mm - this.bounds.maxY) * this.scale + this.offsetY;
                return { x: canvasX, y: canvasY };
            }
            
            shouldShowLayer(layer) {
                if (this.currentLayer === 'all') return true;
                return layer === this.currentLayer;
            }
            
            render() {
                const ctx = this.ctx;
                
                // 清空画布
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (!this.pcbData) return;
                
                const data = this.pcbData.data;
                
                // 绘制网格
                this.drawGrid();
                
                // 按顺序绘制各元素
                if (this.showTracks && data.tracks) {
                    this.drawTracks(data.tracks);
                }
                
                if (this.showArcs && data.arcs) {
                    this.drawArcs(data.arcs);
                }
                
                if (this.showPads && data.pads) {
                    this.drawPads(data.pads);
                }
                
                if (this.showVias && data.vias) {
                    this.drawVias(data.vias);
                }
                
                if (this.showComponents && data.components) {
                    this.drawComponents(data.components);
                }
                
                // 绘制信息面板
                this.drawInfo();
            }
            
            drawGrid() {
                const ctx = this.ctx;
                
                // 动态网格间距
                let gridSpacing = 10;
                if (this.scale < 5) gridSpacing = 50;
                else if (this.scale < 2) gridSpacing = 100;
                else if (this.scale > 30) gridSpacing = 5;
                else if (this.scale > 60) gridSpacing = 1;
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 0.5;
                
                const startX = Math.floor(this.bounds.minX / gridSpacing) * gridSpacing;
                const startY = Math.floor(this.bounds.minY / gridSpacing) * gridSpacing;
                
                // 垂直线
                for (let x = startX; x <= this.bounds.maxX; x += gridSpacing) {
                    const pos = this.pcbToCanvas(x, this.bounds.minY);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, 0);
                    ctx.lineTo(pos.x, this.canvas.height);
                    ctx.stroke();
                }
                
                // 水平线
                for (let y = startY; y <= this.bounds.maxY; y += gridSpacing) {
                    const pos = this.pcbToCanvas(this.bounds.minX, y);
                    ctx.beginPath();
                    ctx.moveTo(0, pos.y);
                    ctx.lineTo(this.canvas.width, pos.y);
                    ctx.stroke();
                }
            }
            
            drawTracks(tracks) {
                const ctx = this.ctx;
                
                tracks.forEach(track => {
                    if (!this.shouldShowLayer(track.layer)) return;
                    
                    const start = this.pcbToCanvas(track.start.x_mm, track.start.y_mm);
                    const end = this.pcbToCanvas(track.end.x_mm, track.end.y_mm);
                    const width = Math.max(track.width_mm * this.scale, 1);
                    
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.strokeStyle = getLayerColor(track.layer);
                    ctx.lineWidth = width;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                });
            }
            
            drawArcs(arcs) {
                const ctx = this.ctx;
                
                arcs.forEach(arc => {
                    if (!this.shouldShowLayer(arc.layer)) return;
                    
                    const center = this.pcbToCanvas(arc.center.x_mm, arc.center.y_mm);
                    const radius = arc.radius_mm * this.scale;
                    const width = Math.max(arc.width_mm * this.scale, 1);
                    
                    // 角度转换 (PCB角度 -> Canvas角度)
                    let startAngle = (arc.start_angle || 0) * Math.PI / 180;
                    let endAngle = (arc.end_angle || 360) * Math.PI / 180;
                    
                    // 处理整圆
                    if (Math.abs(arc.end_angle - arc.start_angle) >= 360 || 
                        (arc.start_angle === 0 && arc.end_angle === 360)) {
                        ctx.beginPath();
                        ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = getLayerColor(arc.layer);
                        ctx.lineWidth = width;
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.arc(center.x, center.y, radius, startAngle, endAngle);
                        ctx.strokeStyle = getLayerColor(arc.layer);
                        ctx.lineWidth = width;
                        ctx.stroke();
                    }
                });
            }
            
            drawPads(pads) {
                const ctx = this.ctx;
                
                pads.forEach(pad => {
                    if (!this.shouldShowLayer(pad.layer)) return;
                    
                    const pos = this.pcbToCanvas(pad.position.x_mm, pad.position.y_mm);
                    const sizeX = (pad.top_size?.x_mm || 1) * this.scale;
                    const sizeY = (pad.top_size?.y_mm || 1) * this.scale;
                    const holeSize = (pad.hole_size_mm || 0) * this.scale;
                    
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate((pad.rotation || 0) * Math.PI / 180);
                    
                    // 焊盘颜色
                    const color = getLayerColor(pad.layer);
                    
                    if (pad.shape === 'rectangular' || pad.shape === 'rounded_rect') {
                        // 矩形焊盘
                        ctx.beginPath();
                        const r = pad.shape === 'rounded_rect' ? Math.min(sizeX, sizeY) * 0.2 : 0;
                        ctx.roundRect(-sizeX / 2, -sizeY / 2, sizeX, sizeY, r);
                        ctx.fillStyle = color;
                        ctx.fill();
                    } else if (pad.shape === 'circular' || pad.shape === 'circle') {
                        // 圆形焊盘
                        const radius = Math.max(sizeX / 2, 1);
                        ctx.beginPath();
                        ctx.arc(0, 0, radius, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                    } else if (pad.shape === 'oval' || pad.shape === 'elliptical') {
                        // 椭圆焊盘
                        ctx.beginPath();
                        ctx.ellipse(0, 0, sizeX / 2, sizeY / 2, 0, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();
                    } else {
                        // 默认矩形
                        ctx.fillStyle = color;
                        ctx.fillRect(-sizeX / 2, -sizeY / 2, sizeX, sizeY);
                    }
                    
                    // 绘制孔
                    if (holeSize > 1) {
                        ctx.beginPath();
                        ctx.arc(0, 0, holeSize / 2, 0, Math.PI * 2);
                        ctx.fillStyle = '#1a1a2e';
                        ctx.fill();
                    }
                    
                    ctx.restore();
                });
            }
            
            drawVias(vias) {
                const ctx = this.ctx;
                
                vias.forEach(via => {
                    const pos = this.pcbToCanvas(via.position.x_mm, via.position.y_mm);
                    const outerRadius = Math.max((via.diameter_mm / 2) * this.scale, 2);
                    const innerRadius = Math.max((via.hole_mm / 2) * this.scale, 1);
                    
                    // 外圈（铜）
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, outerRadius, 0, Math.PI * 2);
                    ctx.fillStyle = '#cccccc';
                    ctx.fill();
                    
                    // 内圈（孔）
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, innerRadius, 0, Math.PI * 2);
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fill();
                });
            }
            
            drawComponents(components) {
                const ctx = this.ctx;
                const fontSize = Math.max(8, Math.min(14, 12 * this.scale / 10));
                
                components.forEach(comp => {
                    const pos = this.pcbToCanvas(comp.position.x_mm, comp.position.y_mm);
                    
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    
                    if (comp.rotation) {
                        ctx.rotate(-comp.rotation * Math.PI / 180);
                    }
                    
                    ctx.font = `bold ${fontSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // 描边
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeText(comp.designator, 0, 0);
                    
                    // 填充
                    ctx.fillStyle = comp.layer === 'top' ? '#00ff88' : '#ff8800';
                    ctx.fillText(comp.designator, 0, 0);
                    
                    ctx.restore();
                });
            }
            
            drawInfo() {
                const ctx = this.ctx;
                const data = this.pcbData?.data;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(this.canvas.width - 160, 10, 150, 100);
                
                ctx.font = '11px Arial';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                
                let y = 26;
                ctx.fillText(`文件: ${this.pcbData?.source_file || '-'}`, this.canvas.width - 150, y);
                y += 16;
                ctx.fillText(`走线: ${data?.tracks?.length || 0}`, this.canvas.width - 150, y);
                y += 14;
                ctx.fillText(`焊盘: ${data?.pads?.length || 0}`, this.canvas.width - 150, y);
                y += 14;
                ctx.fillText(`过孔: ${data?.vias?.length || 0}`, this.canvas.width - 150, y);
                y += 14;
                ctx.fillText(`组件: ${data?.components?.length || 0}`, this.canvas.width - 150, y);
                y += 14;
                ctx.fillText(`网络: ${data?.nets?.length || 0}`, this.canvas.width - 150, y);
            }
        }
        
        // 初始化
        const renderer = new PCBRenderer('pcb-canvas');
        renderer.loadData('output.json');
        
        // 控制事件
        document.getElementById('showTracks').addEventListener('change', (e) => {
            renderer.showTracks = e.target.checked;
            renderer.render();
        });
        
        document.getElementById('showPads').addEventListener('change', (e) => {
            renderer.showPads = e.target.checked;
            renderer.render();
        });
        
        document.getElementById('showVias').addEventListener('change', (e) => {
            renderer.showVias = e.target.checked;
            renderer.render();
        });
        
        document.getElementById('showArcs').addEventListener('change', (e) => {
            renderer.showArcs = e.target.checked;
            renderer.render();
        });
        
        document.getElementById('showComponents').addEventListener('change', (e) => {
            renderer.showComponents = e.target.checked;
            renderer.render();
        });
        
        document.getElementById('layerFilter').addEventListener('change', (e) => {
            renderer.currentLayer = e.target.value;
            renderer.render();
        });
        
        document.getElementById('zoomIn').addEventListener('click', () => {
            renderer.scale = Math.min(renderer.maxScale, renderer.scale * 1.5);
            document.getElementById('scaleValue').textContent = renderer.scale.toFixed(1);
            renderer.render();
        });
        
        document.getElementById('zoomOut').addEventListener('click', () => {
            renderer.scale = Math.max(renderer.minScale, renderer.scale / 1.5);
            document.getElementById('scaleValue').textContent = renderer.scale.toFixed(1);
            renderer.render();
        });
        
        document.getElementById('resetView').addEventListener('click', () => {
            renderer.fitToView();
            renderer.render();
        });
        
        document.getElementById('refreshData').addEventListener('click', () => {
            renderer.loadData('output.json');
        });
    </script>
</body>
</html>
